<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIBoard - Viewer</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="board-page">
    <div class="toolbar">
      <span class="tag" id="boardTag"></span>
      <span class="tag">Read-only viewer</span>
    </div>
    <div class="canvas-wrap">
      <canvas id="board"></canvas>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const boardId = (params.get("board") || "set1").trim() || "set1";
      document.getElementById("boardTag").textContent = `Viewer: ${boardId}`;

      const socket = io();
      socket.emit("join_board", boardId);

      const canvas = document.getElementById("board");
      const ctx = canvas.getContext("2d");
      const segments = [];
      const BOARD_WIDTH = 1920;
      const BOARD_HEIGHT = 1080;

      function getBoardMetrics() {
        const displayWidth = canvas.clientWidth;
        const displayHeight = canvas.clientHeight;
        const scale = Math.min(displayWidth / BOARD_WIDTH, displayHeight / BOARD_HEIGHT);
        const drawWidth = BOARD_WIDTH * scale;
        const drawHeight = BOARD_HEIGHT * scale;
        return {
          scale,
          offsetX: (displayWidth - drawWidth) / 2,
          offsetY: (displayHeight - drawHeight) / 2
        };
      }

      function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        const ratio = window.devicePixelRatio || 1;
        const pixelWidth = Math.round(rect.width * ratio);
        const pixelHeight = Math.round(rect.height * ratio);

        if (canvas.width === pixelWidth && canvas.height === pixelHeight) return;

        canvas.width = pixelWidth;
        canvas.height = pixelHeight;
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        redrawAll();
      }

      function fromNorm(point) {
        const metrics = getBoardMetrics();
        return {
          x: metrics.offsetX + point.x * BOARD_WIDTH * metrics.scale,
          y: metrics.offsetY + point.y * BOARD_HEIGHT * metrics.scale
        };
      }

      function drawSegment(segment) {
        const from = fromNorm(segment.from);
        const to = fromNorm(segment.to);
        const metrics = getBoardMetrics();
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.lineWidth = segment.size * metrics.scale;
        ctx.strokeStyle = segment.mode === "eraser" ? "#ffffff" : segment.color;
        ctx.beginPath();
        ctx.moveTo(from.x, from.y);
        ctx.lineTo(to.x, to.y);
        ctx.stroke();
      }

      function redrawAll() {
        ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
        for (const segment of segments) drawSegment(segment);
      }

      socket.on("board_snapshot", (snapshot) => {
        segments.length = 0;
        for (const segment of snapshot) segments.push(segment);
        redrawAll();
      });

      socket.on("draw_segment", (segment) => {
        segments.push(segment);
        drawSegment(segment);
      });

      socket.on("clear_board", () => {
        segments.length = 0;
        redrawAll();
      });

      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();
    </script>
  </body>
</html>
